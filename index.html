<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TitanMCMC</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #1b1b1b;
      padding: 30px 15px;
    }

    h1 {
      font-size: 45px;
      margin: 10px;
    }

    .subtitle {
      color: #bbb;
      font-size: 18px;
    }

    .server {
      margin: 30px auto;
      padding: 25px;
      max-width: 600px;
      background: #1e1e1e;
      border-radius: 15px;
    }

    .ip {
      font-size: 22px;
      margin: 15px;
      padding: 12px;
      background: #000;
      border-radius: 10px;
    }

    .buttons a {
      display: inline-block;
      margin: 8px;
      padding: 12px 25px;
      border-radius: 10px;
      background: #333;
      color: white;
      text-decoration: none;
    }

    .buttons a:hover {
      background: #555;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background: #1b1b1b;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚔️ TitanMCMC ⚔️</h1>
    <div class="subtitle">سرور ماینکرفت TitanMCMC</div>
  </header>

  <div class="server">
    <h2>🎮 به TitanMCMC خوش آمدید</h2>

    <p>یک سرور ماینکرفت با گیم‌مودهای مختلف</p>

    <div class="ip">
      IP: به‌زودی
    </div>

    <p>نسخه: 1.21.11</p>

    <div class="buttons">
      <a href="#">قوانین</a>
      <a href="#">رنک‌ها</a>
      <a href="#">فروشگاه</a>
      <a href="#">دیسکورد</a>
    </div>
  </div>

  <footer>
    © 2026 TitanMCMC
  </footer>

</body>
</html>
